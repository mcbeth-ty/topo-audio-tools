name: Affective Atlas Linux checks
on:
  push:
    paths:
      - 'harmony-generator/**'
      - 'packages.txt'
      - '.github/workflows/affective-atlas-checks.yml'
  pull_request:
    paths:
      - 'harmony-generator/**'
      - 'packages.txt'
      - '.github/workflows/affective-atlas-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AFFECTIVE_ATLAS_ASSET_CACHE: ${{ runner.temp }}/atlas-assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: harmony-generator/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y libfluidsynth3
      - run: python -m pip install -r harmony-generator/requirements.txt
      - run: python harmony-generator/tools/verify_cloud_demo.py
      - run: python -m unittest discover -s harmony-generator -p 'test_*.py'
        env:
          AMBIENT_SF2_PATH: ${{ runner.temp }}/atlas-assets/GeneralUser-GS.sf2
      - run: node harmony-generator/test_ambient_pathfinder.mjs
