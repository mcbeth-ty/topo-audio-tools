name: Keep Streamlit Apps Awake

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Visit and verify Streamlit apps
        id: verify
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          fs.mkdirSync('diagnostics', { recursive: true });

          const apps = [
            { name: 'Harmonic Sequence Generator', slug: 'harmonic-sequence', url: 'https://harmonic-sequence-demo.streamlit.app/', marker: 'HARMONIC SEQUENCE SETTINGS' },
            { name: 'Topology Explorer', slug: 'topology-explorer', url: 'https://topo-explorer.streamlit.app/', marker: 'DATASET SUMMARY' }
          ];
          const sleepButton = /Yes, get this app back up!/i;
          const sleepText = /This app has gone to sleep due to inactivity/i;
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function verify(page, app) {
            let wakeClicks = 0;
            const deadline = Date.now() + 90000;
            await page.goto(app.url, { waitUntil: 'domcontentloaded', timeout: 45000 });
            while (Date.now() < deadline) {
              const frames = page.frames();
              let markerFound = false;
              let sleeping = false;
              let wakeButton = null;
              for (const frame of frames) {
                const content = await frame.evaluate(() => document.body?.innerText || '').catch(() => '');
                if (content.toLowerCase().includes(app.marker.toLowerCase())) markerFound = true;
                if (sleepText.test(content)) sleeping = true;
                const button = frame.getByRole('button', { name: sleepButton });
                if (await button.count().catch(() => 0) && await button.first().isVisible().catch(() => false)) wakeButton = button.first();
              }
              if (wakeButton) {
                console.log(`${app.name}: sleep screen detected, clicking wake button`);
                await wakeButton.click({ timeout: 10000 });
                wakeClicks++;
                await wait(8000);
                continue;
              }
              if (markerFound && !sleeping) {
                console.log(`${app.name}: VERIFIED rendered content across ${frames.length} frame(s) (wake clicks: ${wakeClicks})`);
                await page.screenshot({ path: `diagnostics/${app.slug}-success.png`, fullPage: true });
                return;
              }
              console.log(`${app.name}: waiting (frames: ${frames.length}, marker: ${markerFound}, sleep: ${sleeping})`);
              await wait(5000);
            }
            for (const [i, frame] of page.frames().entries()) {
              const details = await frame.evaluate(() => ({ text: (document.body?.innerText || '').slice(0, 3000), html: document.body?.outerHTML.slice(0, 500) })).catch(e => ({ error: String(e) }));
              fs.writeFileSync(`diagnostics/${app.slug}-frame-${i}.json`, JSON.stringify({ url: frame.url(), ...details }, null, 2));
            }
            throw new Error(`No verified application content after 90 seconds (wake clicks: ${wakeClicks})`);
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            let failures = 0;
            try {
              for (const app of apps) {
                console.log(`\nChecking ${app.name}`);
                const page = await browser.newPage();
                try {
                  await verify(page, app);
                } catch (error) {
                  failures++;
                  console.error(`${app.name}: FAILED: ${error.stack || error}`);
                  await page.screenshot({ path: `diagnostics/${app.slug}-failure.png`, fullPage: true, timeout: 10000 }).catch(() => {});
                  fs.writeFileSync(`diagnostics/${app.slug}-failure.txt`, String(error.stack || error));
                } finally {
                  await page.close();
                }
              }
            } finally {
              await browser.close();
            }
            if (failures) process.exitCode = 1;
          })().catch(error => { console.error(error); process.exitCode = 1; });
          EOF

      - name: Upload diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7
